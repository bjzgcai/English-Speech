# Installed inside nginx's http context. Empty keys exempt static assets.
# Use the connection peer, never client-supplied forwarding headers, as identity.
map $uri $ee_api_ip { default ""; ~^/(api|auth)(/|$) $binary_remote_addr; }
map $uri $ee_api_global { default ""; ~^/(api|auth)(/|$) englisheval; }
map "$request_method:$uri" $ee_entry_ip {
    default "";
    "POST:/api/admission" $binary_remote_addr;
    ~^.*:/auth/ $binary_remote_addr;
    "GET:/api/me" $binary_remote_addr;
}
map $ee_entry_ip $ee_entry_global { "" ""; default englisheval; }
map "$request_method:$uri" $ee_write_ip {
    default "";
    ~^(POST|PUT|PATCH|DELETE):/api/ $binary_remote_addr;
}
map $ee_write_ip $ee_write_global { "" ""; default englisheval; }
limit_req_zone $ee_api_ip zone=ee_api_ip:10m rate=80r/s;
limit_req_zone $ee_api_global zone=ee_api_global:1m rate=120r/s;
limit_req_zone $ee_entry_ip zone=ee_entry_ip:10m rate=2r/s;
limit_req_zone $ee_entry_global zone=ee_entry_global:1m rate=5r/s;
limit_req_zone $ee_write_ip zone=ee_write_ip:10m rate=15r/s;
limit_req_zone $ee_write_global zone=ee_write_global:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ee_conn_ip:10m;
limit_conn_zone $server_name zone=ee_conn_global:1m;

server {
    listen 80;
    listen [::]:80;
    server_name eng.lab.bza.edu.cn;
    return 301 https://eng.lab.bza.edu.cn$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eng.lab.bza.edu.cn;
    ssl_certificate /etc/nginx/ssl/eng.lab.bza.edu.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/eng.lab.bza.edu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EnglishEvalTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 260m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @busy;
    location @busy {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        return 429 '{"code":"EDGE_BUSY","error":"Server is busy. Please wait and retry."}';
    }
    location / {
        limit_req zone=ee_api_ip burst=200 nodelay;
        limit_req zone=ee_api_global burst=300 nodelay;
        limit_req zone=ee_entry_ip burst=100 nodelay;
        limit_req zone=ee_entry_global burst=200 nodelay;
        limit_req zone=ee_write_ip burst=200 nodelay;
        limit_req zone=ee_write_global burst=250 nodelay;
        limit_conn ee_conn_ip 128;
        limit_conn ee_conn_global 256;
        proxy_pass http://127.0.0.1:3199;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
