<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation codes | OScanner-Eng</title><link rel="stylesheet" href="/intro.css"><link rel="stylesheet" href="/invitation-codes.css"></head><body><header class="docs-nav"><a class="brand" href="/leaderboard"><span class="brand-mark"><span>E</span></span><span>OScanner-Eng</span></a><div class="header-menu"><nav><a href="/leaderboard">Leaderboard</a><a href="/game">Game</a><a href="/examine">Examine</a><a href="/history">History</a><a href="/methodology">Methodology</a><a href="/prepare">Prepare</a><a href="/intro">Intro</a><a href="/invitation-codes" aria-current="page">Invitation codes</a></nav><a class="header-login" data-header-login href="/auth/dingtalk">Sign in</a><div class="auth-chip" data-auth-chip hidden><span data-auth-user-name></span><button data-logout-button>Logout</button></div></div></header><main class="codes-main"><div class="codes-head"><div><p class="codes-kicker">Access management</p><h1>Invitation codes</h1><p>Create and track single-use access codes.</p></div><button class="codes-action" id="create">Generate code</button></div><p id="new" class="codes-message"></p><section class="codes-panel"><table><thead><tr><th>Code</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="list"><tr><td colspan="4" class="empty">Loading codes...</td></tr></tbody></table></section></main><script src="/visitor-session.js"></script><script src="/header-auth.js"></script><script>const list=document.querySelector('#list'),msg=document.querySelector('#new'),state={};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await VisitorSession.fetch('/api/invitation-codes');if(!r.ok){list.innerHTML='<tr><td colspan="4" class="empty">Unable to load invitation codes.</td></tr>';return}const d=await r.json();d.codes.forEach(x=>state[x.id]=x.code);list.innerHTML=d.codes.length?d.codes.map(x=>`<tr><td class="code-value" data-code="${esc(x.id)}">••••${esc(x.codePreview)}</td><td><span class="status ${x.usedAt?'used':''}">${x.usedAt?'Used':'Available'}</span></td><td>${new Date(x.createdAt).toLocaleDateString()}</td><td class="code-actions"><button class="icon-button toggle" data-id="${esc(x.id)}" title="Show or hide code" aria-label="Show or hide code">◉</button><button class="icon-button copy" data-id="${esc(x.id)}" title="Copy code" aria-label="Copy code">⧉</button>${!x.usedAt?`<button class="delete" data-id="${esc(x.id)}">Delete</button>`:''}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No invitation codes yet.</td></tr>';list.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const c=list.querySelector(`[data-code="${b.dataset.id}"]`);c.textContent=c.textContent.includes('••••')?state[b.dataset.id]:'••••'+state[b.dataset.id].slice(-4)});list.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(state[b.dataset.id]);msg.textContent='Code copied to clipboard.'});list.querySelectorAll('.delete').forEach(b=>b.onclick=async()=>{await VisitorSession.fetch('/api/invitation-codes/'+b.dataset.id,{method:'DELETE'});load()})}document.querySelector('#create').onclick=async()=>{const r=await VisitorSession.fetch('/api/invitation-codes',{method:'POST'}),d=await r.json();msg.textContent=d.code?`New code: ${d.code}`:(d.error||'Unable to generate code.');load()};load();</script></body></html>
